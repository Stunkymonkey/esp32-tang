# Tang server that stores its keys in NVS, encrypted with a password. After
# a power loss it waits until POST /activate brings the password, so a
# stolen device stays locked. The password is chosen on the first
# /activate and is never stored.
esphome:
  name: tang-nvs-password

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components

logger:

api:
  encryption:
    key: !secret api_encryption_key
  # For a Home Assistant automation that unlocks the device after every
  # boot: call esphome.tang_nvs_password_tang_activate with the password from
  # HA's secrets when the device comes online and reports locked.
  actions:
    - action: tang_activate
      variables:
        password: string
      then:
        - tang_server.activate:
            password: !lambda "return password;"

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

tang_server:
  key_storage: nvs
  require_password: true
  admin_token: !secret tang_admin_token

binary_sensor:
  - platform: tang_server
    active:
      name: Tang active

text_sensor:
  - platform: tang_server
    state:
      name: Tang state
    last_error:
      name: Tang last error

# Or unlock by hand: type the password, then press the button. The text is
# cleared on every press, so the password does not stay in HA's state. Do not
# add restore_value: it would save the password in flash.
text:
  - platform: template
    id: tang_password
    name: Tang key password
    mode: password
    optimistic: true

button:
  - platform: tang_server
    activate:
      name: Tang activate
      password_id: tang_password
    deactivate:
      name: Tang deactivate
    wipe:
      name: Tang wipe
